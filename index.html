 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebVR Vision Simulator</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
  </style>

  <script>
    AFRAME.registerComponent('vision-overlay', {
      init: function () {
        const el = this.el;
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d', { alpha: true });

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          opacity: 1
        });

        const mesh = el.getOrCreateObject3D('mesh');
        mesh.material = material;

        this.canvas = canvas;
        this.ctx = ctx;
        this.texture = texture;
        this.currentMode = 'normal';

        // Head motion inertial variables (Option 4)
        this.lastRotation = new THREE.Euler();
        this.cameraObj = null;
        this.floaterVelX = 0;
        this.floaterVelY = 0;
        this.floaterPosX = 512;
        this.floaterPosY = 512;

        // Interactive Glare state (Option 2)
        this.glareIntensity = 0;

        this.updateFilter('normal');
      },

      tick: function (time, timeDelta) {
        if (!timeDelta) return;
        const dt = Math.min(timeDelta, 100) / 1000;

        if (!this.cameraObj) {
          const cameraEl = document.querySelector('a-camera');
          if (cameraEl) this.cameraObj = cameraEl.object3D;
        }

        let needsRedraw = false;

        // Option 4: Head Motion Dynamic Physics
        if (this.cameraObj) {
          const currentRot = this.cameraObj.rotation;
          const rotDiffY = currentRot.y - this.lastRotation.y;
          const rotDiffX = currentRot.x - this.lastRotation.x;

          this.floaterVelX += rotDiffY * 2200;
          this.floaterVelY -= rotDiffX * 2200;

          this.lastRotation.copy(currentRot);

          this.floaterVelX *= 0.91;
          this.floaterVelY *= 0.91;

          this.floaterPosX += this.floaterVelX * dt;
          this.floaterPosY += this.floaterVelY * dt;

          this.floaterPosX += (512 - this.floaterPosX) * 1.5 * dt;
          this.floaterPosY += (512 - this.floaterPosY) * 1.5 * dt;

          if (Math.abs(this.floaterVelX) > 0.5 || Math.abs(this.floaterVelY) > 0.5) {
            needsRedraw = true;
          }
        }

        // Option 2: Night Headlight Glare Photophobia
        const car1 = document.querySelector('#car1');
        const envComponent = document.querySelector('a-scene').components['environment'];
        const isNight = envComponent && envComponent.data.preset === 'night';

        if (isNight && car1 && this.cameraObj) {
          const carPos = car1.object3D.position;
          const camPos = this.cameraObj.position;
          const dist = carPos.distanceTo(camPos);

          if (dist < 22) {
            this.glareIntensity = Math.min(1.0, (22 - dist) / 18);
            needsRedraw = true;
          } else {
            if (this.glareIntensity > 0) {
              this.glareIntensity = 0;
              needsRedraw = true;
            }
          }
        } else {
          if (this.glareIntensity > 0) {
            this.glareIntensity = 0;
            needsRedraw = true;
          }
        }

        if (needsRedraw) {
          this.updateFilter(this.currentMode);
        }
      },

      updateFilter: function (mode) {
        this.currentMode = mode;
        const ctx = this.ctx;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, 1024, 1024);

        const fx = this.floaterPosX;
        const fy = this.floaterPosY;
        const glare = this.glareIntensity;

        if (mode === 'amd') {
          // Macular Degeneration
          const grad = ctx.createRadialGradient(512, 512, 10, 512, 512, 280);
          grad.addColorStop(0, 'rgba(15, 12, 10, 0.98)');
          grad.addColorStop(0.6, 'rgba(35, 28, 20, 0.9)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 280, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'glaucoma') {
          // Glaucoma
          ctx.fillStyle = 'rgba(5, 5, 5, 0.98)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 120, 512, 512, 350);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 350, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'diabetic') {
          // Diabetic Retinopathy
          ctx.fillStyle = 'rgba(15, 10, 5, 0.88)';
          const spots = [
            [fx - 212, fy - 262, 75], [fx + 128, fy - 152, 95], 
            [fx - 112, fy + 168, 105], [fx + 248, fy + 128, 65], 
            [fx, fy - 392, 55], [fx + 368, fy + 368, 85]
          ];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'cataract') {
          // Cataracts
          ctx.fillStyle = `rgba(195, 155, 75, ${0.42 + glare * 0.25})`;
          ctx.fillRect(0, 0, 1024, 1024);

          if (glare > 0) {
            const grad = ctx.createRadialGradient(512, 512, 20, 512, 512, 450);
            grad.addColorStop(0, `rgba(255, 255, 220, ${glare * 0.85})`);
            grad.addColorStop(0.5, `rgba(255, 200, 100, ${glare * 0.5})`);
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(512, 512, 450, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (mode === 'keratoconus') {
          // Keratoconus
          const shiftX = (fx - 512) * 0.35;
          const shiftY = (fy - 512) * 0.35;

          ctx.fillStyle = `rgba(235, 242, 255, ${0.38 + glare * 0.3})`;
          const spots = [
            [512 + shiftX, 560 + shiftY, 260], 
            [450 - shiftX, 500 - shiftY, 190], 
            [570 + shiftX, 500 + shiftY, 190]
          ];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.ellipse(x, y, r, r * 1.5, Math.PI / 7, 0, Math.PI * 2);
            ctx.fill();
          });

          if (glare > 0) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${glare * 0.7})`;
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.moveTo(0, 512); ctx.lineTo(1024, 512);
            ctx.moveTo(512, 0); ctx.lineTo(512, 1024);
            ctx.stroke();
          }
        } else if (mode === 'opacity') {
          // Corneal Opacity
          ctx.fillStyle = 'rgba(245, 245, 245, 0.92)';
          ctx.beginPath();
          ctx.ellipse(360, 440, 210, 310, Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'fuchs') {
          // Fuchs' Dystrophy
          ctx.fillStyle = 'rgba(235, 242, 255, 0.42)';
          ctx.fillRect(0, 0, 1024, 1024);
          const grad = ctx.createRadialGradient(512, 512, 80, 512, 512, 460);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 460, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'rp') {
          // Retinitis Pigmentosa
          ctx.fillStyle = 'rgba(5, 5, 5, 0.99)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 35, 512, 512, 150);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 150, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'cscr') {
          // CSCR
          const grad = ctx.createRadialGradient(fx, fy, 20, fx, fy, 190);
          grad.addColorStop(0, 'rgba(90, 100, 110, 0.72)');
          grad.addColorStop(0.85, 'rgba(150, 160, 170, 0.35)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(fx, fy, 190, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'uveitis') {
          // Anterior Uveitis
          ctx.fillStyle = `rgba(255, 248, 225, ${0.35 + glare * 0.45})`;
          ctx.fillRect(0, 0, 1024, 1024);

          ctx.fillStyle = 'rgba(170, 160, 140, 0.75)';
          const cells = [
            [fx - 32, fy - 22, 14], [fx + 18, fy + 8, 9], 
            [fx - 12, fy - 52, 16], [fx - 62, fy + 18, 11], 
            [fx + 38, fy - 42, 10], [fx - 92, fy - 72, 8]
          ];
          cells.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'dryeye') {
          // Severe Dry Eye
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.fillStyle = 'rgba(210, 220, 235, 0.45)';
          const streaks = [[200, 300, 420, 85], [100, 600, 520, 65], [300, 150, 380, 75]];
          streaks.forEach(([x, y, w, h]) => {
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, Math.PI / 12, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.restore();
        this.texture.needsUpdate = true;
      }
    });

    AFRAME.registerComponent('mode-switcher', {
      init: function () {
        this.modes = [
          'normal', 'amd', 'glaucoma', 'diabetic', 'cataract', 
          'keratoconus', 'opacity', 'fuchs', 'rp', 'cscr', 'uveitis', 'dryeye'
        ];
        this.index = 0;
        this.labels = {
          'normal': '1/12 Normal Vision',
          'amd': '2/12 Macular Degeneration (AMD)',
          'glaucoma': '3/12 Glaucoma (Peripheral Loss)',
          'diabetic': '4/12 Diabetic Retinopathy (Scotomas)',
          'cataract': '5/12 Cataracts (Clouded / Tinted)',
          'keratoconus': '6/12 Keratoconus (Distortion & Flare)',
          'opacity': '7/12 Corneal Opacity / Scarring',
          'fuchs': "8/12 Fuchs' Dystrophy (Corneal Edema)",
          'rp': '9/12 Retinitis Pigmentosa (Tunnel Vision)',
          'cscr': '10/12 Central Serous Chorioretinopathy',
          'uveitis': '11/12 Anterior Uveitis (Photophobia/Cells)',
          'dryeye': '12/12 Severe Dry Eye / Keratitis'
        };

        this.nextMode = this.nextMode.bind(this);
        this.setMode = this.setMode.bind(this);

        this.el.addEventListener('triggerdown', this.nextMode);
        this.el.addEventListener('abuttondown', this.nextMode);
        this.el.addEventListener('xbuttondown', this.nextMode);

        const select = document.getElementById('condition-select');
        if (select) {
          select.addEventListener('change', (e) => {
            this.setMode(e.target.value);
          });
        }
      },

      nextMode: function () {
        this.index = (this.index + 1) % this.modes.length;
        const selected = this.modes[this.index];
        this.applyMode(selected);
        
        const select = document.getElementById('condition-select');
        if (select) select.value = selected;
      },

      setMode: function (selectedKey) {
        const foundIdx = this.modes.indexOf(selectedKey);
        if (foundIdx !== -1) {
          this.index = foundIdx;
          this.applyMode(selectedKey);
        }
      },

      applyMode: function (selected) {
        const overlay = document.querySelector('#overlay');
        const text = document.querySelector('#hud-text');
        const clickSound = document.querySelector('#click-sound-entity');

        if (clickSound && clickSound.components.sound) {
          try {
            clickSound.components.sound.stopSound();
            clickSound.components.sound.playSound();
          } catch(e) {}
        }

        if (overlay && overlay.components['vision-overlay']) {
          overlay.components['vision-overlay'].updateFilter(selected);
        }
        if (text) {
          text.setAttribute('value', `Condition: ${this.labels[selected]}`);
        }
      }
    });

    AFRAME.registerComponent('realistic-walker', {
      schema: {
        speed: { type: 'number', default: 1.2 },
        direction: { type: 'number', default: 1 }
      },
      init: function () {
        this.leftThigh = this.el.querySelector('.left-thigh');
        this.rightThigh = this.el.querySelector('.right-thigh');
        this.leftShin = this.el.querySelector('.left-shin');
        this.rightShin = this.el.querySelector('.right-shin');
        this.leftArm = this.el.querySelector('.left-arm');
        this.rightArm = this.el.querySelector('.right-arm');
        this.torso = this.el.querySelector('.torso');
        this.time = Math.random() * 100;
        
        this.el.object3D.matrixAutoUpdate = true;
      },
      tick: function (t, dt) {
        if (!dt) return;
        
        const deltaSec = Math.min(dt, 100) / 1000;
        let pos = this.el.getAttribute('position');
        pos.x += this.data.speed * this.data.direction * deltaSec;

        if (this.data.direction === 1 && pos.x > 25) pos.x = -25;
        if (this.data.direction === -1 && pos.x < -25) pos.x = 25;

        this.time += deltaSec * 4.5;
        const bob = Math.abs(Math.sin(this.time)) * 0.04;
        pos.y = bob;
        
        this.el.setAttribute('position', pos);

        const legSwing = Math.sin(this.time) * 22;
        const kneeBend = Math.max(0, Math.sin(this.time + Math.PI / 4) * 20);
        const altKneeBend = Math.max(0, Math.sin(this.time - Math.PI / 4) * 20);

        if (this.leftThigh) this.leftThigh.setAttribute('rotation', `${legSwing} 0 0`);
        if (this.rightThigh) this.rightThigh.setAttribute('rotation', `${-legSwing} 0 0`);
        if (this.leftShin) this.leftShin.setAttribute('rotation', `${kneeBend} 0 0`);
        if (this.rightShin) this.rightShin.setAttribute('rotation', `${altKneeBend} 0 0`);
        
        if (this.leftArm) this.leftArm.setAttribute('rotation', `${-legSwing * 0.7} 0 0`);
        if (this.rightArm) this.rightArm.setAttribute('rotation', `${legSwing * 0.7} 0 0`);
        if (this.torso) this.torso.setAttribute('rotation', `0 ${Math.sin(this.time) * 3} 0`);
      }
    });

    // Time-of-Day Switcher function for 2D UI & VR 3D Buttons
    window.setEnvironmentPreset = function (presetName) {
      const envEl = document.querySelector('[environment]');
      const headLights = document.querySelectorAll('.headlight');
      const clickSound = document.querySelector('#click-sound-entity');

      if (clickSound && clickSound.components.sound) {
        try {
          clickSound.components.sound.stopSound();
          clickSound.components.sound.playSound();
        } catch(e) {}
      }

      if (presetName === 'morning') {
        envEl.setAttribute('environment', {
          preset: 'forest', skyType: 'atmosphere', skyColor: '#87CEEB', horizonColor: '#E0F6FF',
          lightPosition: { x: 0, y: 1, z: 0.5 }, dressingAmount: 55, fog: 0.04
        });
        headLights.forEach(hl => hl.setAttribute('visible', 'false'));
      } else if (presetName === 'dusk') {
        envEl.setAttribute('environment', {
          preset: 'sunset', skyType: 'gradient', horizonColor: '#FDBA74',
          lightPosition: { x: -0.8, y: 0.2, z: -0.5 }, dressingAmount: 55, fog: 0.08
        });
        headLights.forEach(hl => hl.setAttribute('visible', 'true'));
      } else if (presetName === 'night') {
        envEl.setAttribute('environment', {
          preset: 'night', skyType: 'gradient', horizonColor: '#0F172A',
          lightPosition: { x: 0, y: -1, z: 0 }, dressingAmount: 55, fog: 0.12
        });
        headLights.forEach(hl => hl.setAttribute('visible', 'true'));
      }
    };

    // Helper for 3D HUD next mode button click
    window.cycleVRMode = function () {
      const modeSwitcherEl = document.querySelector('[mode-switcher]');
      if (modeSwitcherEl && modeSwitcherEl.components['mode-switcher']) {
        modeSwitcherEl.components['mode-switcher'].nextMode();
      }
    };
  </script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">

  <!-- Desktop 2D Overlay Control Panel -->
  <div class="fixed top-4 left-4 z-[9999] w-80 bg-white/95 backdrop-blur-md rounded-2xl p-5 shadow-2xl border border-white/20 text-slate-900 transition-all duration-300 hover:bg-white">
    <div class="flex items-center space-x-3 mb-3">
      <div class="w-3 h-3 rounded-full bg-blue-600 animate-pulse"></div>
      <h3 class="font-bold text-base tracking-tight text-blue-600">Vision Simulator VR</h3>
    </div>
    
    <label for="condition-select" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
      1. Vision Condition
    </label>
    <select id="condition-select" class="w-full px-3 py-2 bg-slate-100 hover:bg-slate-200 focus:bg-white border border-slate-300 rounded-xl text-slate-800 text-sm font-medium transition-all outline-none focus:ring-2 focus:ring-blue-500 mb-3">
      <option value="normal">1. Normal Vision</option>
      <option value="amd">2. Macular Degeneration (AMD)</option>
      <option value="glaucoma">3. Glaucoma (Peripheral Loss)</option>
      <option value="diabetic">4. Diabetic Retinopathy</option>
      <option value="cataract">5. Cataracts (Clouded / Tinted)</option>
      <option value="keratoconus">6. Keratoconus (Distortion & Flare)</option>
      <option value="opacity">7. Corneal Opacity / Scarring</option>
      <option value="fuchs">8. Fuchs' Dystrophy (Edema)</option>
      <option value="rp">9. Retinitis Pigmentosa (Tunnel)</option>
      <option value="cscr">10. Central Serous Chorioretinopathy</option>
      <option value="uveitis">11. Anterior Uveitis (Photophobia)</option>
      <option value="dryeye">12. Severe Dry Eye (Keratitis)</option>
    </select>

    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
      2. Time of Day (2D & VR HUD)
    </label>
    <div class="grid grid-cols-3 gap-1.5 mb-3">
      <button onclick="setEnvironmentPreset('morning')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 transition-all">Morning</button>
      <button onclick="setEnvironmentPreset('dusk')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 transition-all">Dusk</button>
      <button onclick="setEnvironmentPreset('night')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 transition-all">Night</button>
    </div>

    <div class="pt-3 border-t border-slate-200 text-xs text-slate-500 flex items-center justify-between">
      <span>VR HUD Controls:</span>
      <span class="font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded-md">3D Buttons / Lasers</span>
    </div>
  </div>

  <a-scene render-order="background, terrain, dynamic, overlay">
    <a-assets>
      <audio id="click-sound" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg" crossorigin="anonymous"></audio>
      <audio id="engine-sound" src="https://cdn.freesound.org/previews/387/387602_5121236-lq.mp3" crossorigin="anonymous"></audio>
      <audio id="ambient-sound" src="https://cdn.freesound.org/previews/416/416529_5121236-lq.mp3" crossorigin="anonymous"></audio>
    </a-assets>

    <a-entity sound="src: #ambient-sound; autoplay: true; loop: true; volume: 0.3"></a-entity>
    <a-entity id="click-sound-entity" sound="src: #click-sound; autoplay: false; volume: 0.8"></a-entity>

    <a-entity environment="preset: forest; skyType: atmosphere; skyColor: #87CEEB; horizonColor: #E0F6FF; lightPosition: 0 1 0.5; dressingAmount: 55; playArea: 1.5; fog: 0.04"></a-entity>
    <a-entity light="type: ambient; color: #E0F2FE; intensity: 0.85"></a-entity>
    <a-entity light="type: directional; color: #FFFDF0; intensity: 1.25" position="-10 20 15"></a-entity>

    <a-entity id="ground-surfaces">
      <a-plane position="0 0.01 -10" rotation="-90 0 0" width="100" height="8" 
               material="color: #1E293B; roughness: 0.9; depthTest: true; depthWrite: true"></a-plane>

      <a-plane position="0 0.02 -6.5" rotation="-90 0 0" width="100" height="3" 
               material="color: #CBD5E1; roughness: 0.8; depthTest: true; depthWrite: true"></a-plane>

      <a-plane position="0 0.03 -10" rotation="-90 0 0" width="100" height="0.2" 
               material="color: #FAC815; depthTest: true; depthWrite: true"></a-plane>

      <a-entity position="0 0.04 -6.5">
        <a-plane position="-2 0 0" rotation="-90 0 0" width="0.6" height="2.8" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="-1 0 0" rotation="-90 0 0" width="0.6" height="2.8" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="0 0 0" rotation="-90 0 0" width="0.6" height="2.8" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="1 0 0" rotation="-90 0 0" width="0.6" height="2.8" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="2 0 0" rotation="-90 0 0" width="0.6" height="2.8" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
      </a-entity>
    </a-entity>

    <a-entity id="car1" position="30 0.6 -8.5"
              animation="property: position; to: -30 0.6 -8.5; loop: true; dur: 6000; easing: linear"
              sound="src: #engine-sound; autoplay: true; loop: true; volume: 0.6; positional: true; distanceModel: linear; maxDistance: 40">
      <a-box width="3.5" height="1" depth="1.8" color="#DC2626"></a-box>
      <a-box position="0 0.7 0" width="1.8" height="0.7" depth="1.6" color="#0F172A"></a-box>
      <a-sphere position="-1.7 0.1 0.5" radius="0.15" color="#FEF08A"></a-sphere>
      <a-sphere position="-1.7 0.1 -0.5" radius="0.15" color="#FEF08A"></a-sphere>

      <a-entity class="headlight" visible="false" position="-1.8 0.1 0">
        <a-entity light="type: spot; color: #FFFDF0; intensity: 4.5; angle: 45; penumbra: 0.5" rotation="0 -90 0"></a-entity>
        <a-cone position="-2.5 0 0" rotation="0 0 -90" radius-bottom="1.2" radius-top="0.1" height="5" material="color: #FEF08A; opacity: 0.25; transparent: true"></a-cone>
      </a-entity>
    </a-entity>

    <a-entity id="car2" position="-30 0.6 -11.5"
              animation="property: position; to: 30 0.6 -11.5; loop: true; dur: 8000; easing: linear"
              sound="src: #engine-sound; autoplay: true; loop: true; volume: 0.5; positional: true; distanceModel: linear; maxDistance: 40">
      <a-box width="3.8" height="1.1" depth="1.8" color="#2563EB"></a-box>
      <a-box position="0 0.7 0" width="2.0" height="0.7" depth="1.6" color="#1E293B"></a-box>
      <a-sphere position="1.9 0.1 0.5" radius="0.15" color="#FEF08A"></a-sphere>
      <a-sphere position="1.9 0.1 -0.5" radius="0.15" color="#FEF08A"></a-sphere>

      <a-entity class="headlight" visible="false" position="1.9 0.1 0">
        <a-entity light="type: spot; color: #FFFDF0; intensity: 4.5; angle: 45; penumbra: 0.5" rotation="0 90 0"></a-entity>
        <a-cone position="2.5 0 0" rotation="0 0 90" radius-bottom="1.2" radius-top="0.1" height="5" material="color: #FEF08A; opacity: 0.25; transparent: true"></a-cone>
      </a-entity>
    </a-entity>

    <!-- Pedestrian 1 -->
    <a-entity realistic-walker="speed: 1.1; direction: 1" position="-10 0 -6.2" rotation="0 90 0">
      <a-entity class="torso" position="0 1.15 0">
        <a-box width="0.38" height="0.55" depth="0.22" color="#1E3A8A"></a-box>
        <a-cylinder position="0 0.38 0" radius="0.05" height="0.1" color="#D2A679"></a-cylinder>
        <a-sphere position="0 0.52 0" radius="0.12" color="#D2A679">
          <a-sphere position="0 0.05 -0.02" radius="0.128" color="#3B2314"></a-sphere>
          <a-box position="0 0 0.13" width="0.03" height="0.05" depth="0.04" color="#C29669"></a-box>
        </a-sphere>
        <a-entity class="left-arm" position="-0.22 0.1 0">
          <a-cylinder position="0 -0.22 0" radius="0.045" height="0.48" color="#1E3A8A"></a-cylinder>
          <a-sphere position="0 -0.48 0" radius="0.04" color="#D2A679"></a-sphere>
        </a-entity>
        <a-entity class="right-arm" position="0.22 0.1 0">
          <a-cylinder position="0 -0.22 0" radius="0.045" height="0.48" color="#1E3A8A"></a-cylinder>
          <a-sphere position="0 -0.48 0" radius="0.04" color="#D2A679"></a-sphere>
        </a-entity>
      </a-entity>
      <a-entity class="left-thigh" position="-0.1 0.88 0">
        <a-cylinder position="0 -0.22 0" radius="0.065" height="0.45" color="#374151"></a-cylinder>
        <a-entity class="left-shin" position="0 -0.45 0">
          <a-cylinder position="0 -0.2 0" radius="0.055" height="0.4" color="#1F2937"></a-cylinder>
          <a-box position="0 -0.42 0.05" width="0.09" height="0.07" depth="0.18" color="#111827"></a-box>
        </a-entity>
      </a-entity>
      <a-entity class="right-thigh" position="0.1 0.88 0">
        <a-cylinder position="0 -0.22 0" radius="0.065" height="0.45" color="#374151"></a-cylinder>
        <a-entity class="right-shin" position="0 -0.45 0">
          <a-cylinder position="0 -0.2 0" radius="0.055" height="0.4" color="#1F2937"></a-cylinder>
          <a-box position="0 -0.42 0.05" width="0.09" height="0.07" depth="0.18" color="#111827"></a-box>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Pedestrian 2 -->
    <a-entity realistic-walker="speed: 1.3; direction: -1" position="12 0 -6.8" rotation="0 -90 0">
      <a-entity class="torso" position="0 1.08 0">
        <a-box width="0.34" height="0.5" depth="0.2" color="#E11D48"></a-box>
        <a-cylinder position="0 0.35 0" radius="0.045" height="0.09" color="#8D5524"></a-cylinder>
        <a-sphere position="0 0.48 0" radius="0.11" color="#8D5524">
          <a-box position="0 0.02 -0.06" width="0.24" height="0.28" depth="0.12" color="#1C1917"></a-box>
        </a-sphere>
        <a-entity class="left-arm" position="-0.19 0.1 0">
          <a-cylinder position="0 -0.2 0" radius="0.04" height="0.44" color="#E11D48"></a-cylinder>
        </a-entity>
        <a-entity class="right-arm" position="0.19 0.1 0">
          <a-cylinder position="0 -0.2 0" radius="0.04" height="0.44" color="#E11D48"></a-cylinder>
        </a-entity>
      </a-entity>
      <a-entity class="left-thigh" position="-0.09 0.82 0">
        <a-cylinder position="0 -0.2 0" radius="0.055" height="0.42" color="#8D5524"></a-cylinder>
        <a-entity class="left-shin" position="0 -0.42 0">
          <a-cylinder position="0 -0.18 0" radius="0.048" height="0.38" color="#8D5524"></a-cylinder>
          <a-box position="0 -0.4 0.04" width="0.08" height="0.06" depth="0.15" color="#451A03"></a-box>
        </a-entity>
      </a-entity>
      <a-entity class="right-thigh" position="0.09 0.82 0">
        <a-cylinder position="0 -0.2 0" radius="0.055" height="0.42" color="#8D5524"></a-cylinder>
        <a-entity class="right-shin" position="0 -0.42 0">
          <a-cylinder position="0 -0.18 0" radius="0.048" height="0.38" color="#8D5524"></a-cylinder>
          <a-box position="0 -0.4 0.04" width="0.08" height="0.06" depth="0.15" color="#451A03"></a-box>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity position="0 12 -12" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      <a-entity position="6 0 0">
        <a-cone position="-0.3 0 0" rotation="0 0 70" radius-bottom="0.05" radius-top="0.01" height="0.8" color="#111"></a-cone>
        <a-cone position="0.3 0 0" rotation="0 0 -70" radius-bottom="0.05" radius-top="0.01" height="0.8" color="#111"></a-cone>
      </a-entity>
    </a-entity>

    <a-entity id="rig" position="0 1.6 0">
      <a-camera look-controls cursor="rayOrigin: mouse">
        <!-- Canvas Overlay Plane -->
        <a-plane id="overlay" vision-overlay position="0 0 -0.5" width="2" height="2" 
                 material="shader: flat; depthTest: false; depthWrite: false; transparent: true"></a-plane>
        
        <!-- Interactive 3D VR HUD Floating Panel -->
        <a-entity id="hud-panel" position="0 -0.55 -1.5">
          <!-- Background Panel Plane -->
          <a-plane color="#FFFFFF" opacity="0.95" width="1.7" height="0.45" position="0 0 -0.01"></a-plane>
          <a-plane color="#2563EB" opacity="0.95" width="1.7" height="0.04" position="0 0.205 0"></a-plane>
          
          <!-- Condition Status Text -->
          <a-text id="hud-text" value="Condition: 1/12 Normal Vision" 
                  align="center" width="1.9" color="#0F172A" position="0 0.12 0.01"></a-text>

          <!-- VR Interactive 3D Buttons Layer -->
          <!-- 1. Next Condition 3D Button -->
          <a-plane class="raycastable" onclick="cycleVRMode()" position="-0.48 -0.04 0.02" width="0.65" height="0.12" color="#2563EB">
            <a-text value="Cycle Condition" align="center" width="1.5" color="#FFFFFF" position="0 0 0.01"></a-text>
          </a-plane>

          <!-- 2. Time of Day VR 3D Buttons (Day / Dusk / Night) -->
          <a-entity position="0.38 -0.04 0.02">
            <!-- Morning/Day Button -->
            <a-plane class="raycastable" onclick="setEnvironmentPreset('morning')" position="-0.26 0 0" width="0.22" height="0.12" color="#3B82F6">
              <a-text value="Day" align="center" width="1.5" color="#FFFFFF" position="0 0 0.01"></a-text>
            </a-plane>
            <!-- Dusk Button -->
            <a-plane class="raycastable" onclick="setEnvironmentPreset('dusk')" position="0 0 0" width="0.22" height="0.12" color="#F59E0B">
              <a-text value="Dusk" align="center" width="1.5" color="#FFFFFF" position="0 0 0.01"></a-text>
            </a-plane>
            <!-- Night Button -->
            <a-plane class="raycastable" onclick="setEnvironmentPreset('night')" position="0.26 0 0" width="0.22" height="0.12" color="#1E293B">
              <a-text value="Night" align="center" width="1.5" color="#FFFFFF" position="0 0 0.01"></a-text>
            </a-plane>
          </a-entity>

          <!-- Subtext hint -->
          <a-text value="Point laser & trigger to select in VR" align="center" width="1.2" color="#64748B" position="0 -0.16 0.01"></a-text>
        </a-entity>
      </a-camera>

      <a-entity mode-switcher laser-controls="hand: right" raycaster="objects: .raycastable; far: 5"></a-entity>
      <a-entity mode-switcher laser-controls="hand: left" raycaster="objects: .raycastable; far: 5"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
