 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vision Simulator VR - Sound Enhanced</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  
  <style>
    #ui-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.92);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 1px solid rgba(0,0,0,0.1);
      max-width: 280px;
    }
    #ui-controls h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #2563EB;
    }
    #ui-controls select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #CCC;
      background: #FFF;
      color: #111;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    #ui-controls p {
      margin: 6px 0 0 0;
      font-size: 11px;
      color: #555;
    }
  </style>

  <script>
    AFRAME.registerComponent('vision-overlay', {
      init: function () {
        const el = this.el;
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          opacity: 1
        });

        el.getOrCreateObject3D('mesh').material = material;
        el.setAttribute('material', { shader: 'flat', depthTest: false });

        this.ctx = ctx;
        this.texture = texture;
        this.updateFilter('normal');
      },

      updateFilter: function (mode) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, 1024, 1024);

        if (mode === 'amd') {
          const grad = ctx.createRadialGradient(512, 512, 10, 512, 512, 300);
          grad.addColorStop(0, 'rgba(10, 10, 10, 0.99)');
          grad.addColorStop(0.7, 'rgba(30, 30, 30, 0.9)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 300, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'glaucoma') {
          ctx.fillStyle = 'rgba(0,0,0,0.98)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 120, 512, 512, 350);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 350, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        } else if (mode === 'diabetic') {
          ctx.fillStyle = 'rgba(15, 15, 15, 0.9)';
          const spots = [[300, 250, 70], [640, 360, 90], [400, 680, 100], [760, 640, 60], [512, 100, 50], [900, 900, 80]];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'cataract') {
          ctx.fillStyle = 'rgba(190, 150, 80, 0.4)';
          ctx.fillRect(0, 0, 1024, 1024);
        } else if (mode === 'keratoconus') {
          ctx.fillStyle = 'rgba(230, 240, 255, 0.35)';
          const spots = [[512, 560, 250], [460, 512, 180], [560, 512, 180]];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.ellipse(x, y, r, r * 1.5, Math.PI / 8, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'opacity') {
          ctx.fillStyle = 'rgba(250, 250, 250, 0.92)';
          ctx.beginPath();
          ctx.ellipse(350, 450, 200, 300, Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'fuchs') {
          ctx.fillStyle = 'rgba(240, 245, 255, 0.45)';
          ctx.fillRect(0, 0, 1024, 1024);
          const grad = ctx.createRadialGradient(512, 512, 80, 512, 512, 450);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 450, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'rp') {
          ctx.fillStyle = 'rgba(5, 5, 5, 0.99)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 40, 512, 512, 160);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 160, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        } else if (mode === 'cscr') {
          const grad = ctx.createRadialGradient(512, 512, 20, 512, 512, 180);
          grad.addColorStop(0, 'rgba(100, 110, 120, 0.7)');
          grad.addColorStop(0.8, 'rgba(160, 170, 180, 0.35)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 180, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'uveitis') {
          ctx.fillStyle = 'rgba(255, 250, 230, 0.32)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.fillStyle = 'rgba(180, 170, 150, 0.6)';
          const cells = [[480, 490, 12], [530, 520, 8], [500, 460, 15], [450, 530, 10], [550, 470, 9]];
          cells.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'dryeye') {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.fillStyle = 'rgba(220, 225, 235, 0.4)';
          const streaks = [[200, 300, 400, 80], [100, 600, 500, 60], [300, 150, 350, 70]];
          streaks.forEach(([x, y, w, h]) => {
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, Math.PI / 12, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        this.texture.needsUpdate = true;
      }
    });

    AFRAME.registerComponent('mode-switcher', {
      init: function () {
        this.modes = [
          'normal', 'amd', 'glaucoma', 'diabetic', 'cataract', 
          'keratoconus', 'opacity', 'fuchs', 'rp', 'cscr', 'uveitis', 'dryeye'
        ];
        this.index = 0;
        this.labels = {
          'normal': '1/12 Normal Vision',
          'amd': '2/12 Macular Degeneration (AMD)',
          'glaucoma': '3/12 Glaucoma (Peripheral Loss)',
          'diabetic': '4/12 Diabetic Retinopathy (Scotomas)',
          'cataract': '5/12 Cataracts (Clouded / Tinted)',
          'keratoconus': '6/12 Keratoconus (Distortion & Flare)',
          'opacity': '7/12 Corneal Opacity / Scarring',
          'fuchs': "8/12 Fuchs' Dystrophy (Corneal Edema)",
          'rp': '9/12 Retinitis Pigmentosa (Tunnel Vision)',
          'cscr': '10/12 Central Serous Chorioretinopathy',
          'uveitis': '11/12 Anterior Uveitis (Photophobia/Cells)',
          'dryeye': '12/12 Severe Dry Eye / Superficial Keratitis'
        };

        this.nextMode = this.nextMode.bind(this);
        this.setMode = this.setMode.bind(this);

        this.el.addEventListener('triggerdown', this.nextMode);
        this.el.addEventListener('abuttondown', this.nextMode);
        this.el.addEventListener('xbuttondown', this.nextMode);

        const select = document.getElementById('condition-select');
        if (select) {
          select.addEventListener('change', (e) => {
            this.setMode(e.target.value);
          });
        }
      },

      nextMode: function () {
        this.index = (this.index + 1) % this.modes.length;
        const selected = this.modes[this.index];
        this.applyMode(selected);
        
        const select = document.getElementById('condition-select');
        if (select) select.value = selected;
      },

      setMode: function (selectedKey) {
        const foundIdx = this.modes.indexOf(selectedKey);
        if (foundIdx !== -1) {
          this.index = foundIdx;
          this.applyMode(selectedKey);
        }
      },

      applyMode: function (selected) {
        const overlay = document.querySelector('#overlay');
        const text = document.querySelector('#hud-text');
        const clickSound = document.querySelector('#click-sound-entity');

        // Play UI Click Sound
        if (clickSound && clickSound.components.sound) {
          clickSound.components.sound.stopSound();
          clickSound.components.sound.playSound();
        }

        if (overlay && overlay.components['vision-overlay']) {
          overlay.components['vision-overlay'].updateFilter(selected);
        }
        if (text) {
          text.setAttribute('value', `Condition: ${this.labels[selected]}\n(Press Trigger or A/X to Next)`);
        }
      }
    });
  </script>
</head>
<body>

  <div id="ui-controls">
    <h3>Vision Simulator VR</h3>
    <select id="condition-select">
      <option value="normal">1/12 Normal Vision</option>
      <option value="amd">2/12 Macular Degeneration (AMD)</option>
      <option value="glaucoma">3/12 Glaucoma (Peripheral Loss)</option>
      <option value="diabetic">4/12 Diabetic Retinopathy</option>
      <option value="cataract">5/12 Cataracts</option>
      <option value="keratoconus">6/12 Keratoconus</option>
      <option value="opacity">7/12 Corneal Opacity / Scarring</option>
      <option value="fuchs">8/12 Fuchs' Dystrophy</option>
      <option value="rp">9/12 Retinitis Pigmentosa</option>
      <option value="cscr">10/12 Central Serous Chorioretinopathy</option>
      <option value="uveitis">11/12 Anterior Uveitis</option>
      <option value="dryeye">12/12 Severe Dry Eye</option>
    </select>
    <p>Press <b>Trigger</b> or <b>A/X</b> in Quest VR to cycle conditions.</p>
  </div>

  <a-scene>
    <!-- Asset Management System for Sounds -->
    <a-assets>
      <!-- Click Sound for UI -->
      <audio id="click-sound" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg" crossorigin="anonymous"></audio>
      <!-- Car Engine Sound -->
      <audio id="engine-sound" src="https://cdn.freesound.org/previews/387/387602_5121236-lq.mp3" crossorigin="anonymous"></audio>
      <!-- Park Ambient Birds Sound -->
      <audio id="ambient-sound" src="https://cdn.freesound.org/previews/416/416529_5121236-lq.mp3" crossorigin="anonymous"></audio>
    </a-assets>

    <!-- Global Ambient Sound (Birds & Breeze) -->
    <a-entity sound="src: #ambient-sound; autoplay: true; loop: true; volume: 0.3"></a-entity>

    <!-- Sound UI Feedback Entity -->
    <a-entity id="click-sound-entity" sound="src: #click-sound; autoplay: false; volume: 0.8"></a-entity>

    <!-- Morning Park Environment -->
    <a-entity environment="preset: forest; skyType: atmosphere; skyColor: #87CEEB; horizonColor: #E0F6FF; lightPosition: 0 1 0.5; dressingAmount: 50; playArea: 1.5; fog: 0.15"></a-entity>

    <!-- Paved Road & Lines -->
    <a-plane position="0 0.01 -10" rotation="-90 0 0" width="100" height="8" color="#2B2B2B"></a-plane>
    <a-plane position="0 0.02 -10" rotation="-90 0 0" width="100" height="0.2" color="#FFD700"></a-plane>

    <!-- Car 1 with Positional 3D Sound -->
    <a-entity id="car1" position="30 0.6 -8.5"
              animation="property: position; to: -30 0.6 -8.5; loop: true; dur: 6000; easing: linear"
              sound="src: #engine-sound; autoplay: true; loop: true; volume: 0.6; positional: true; distanceModel: linear; maxDistance: 40">
      <a-box width="3.5" height="1" depth="1.8" color="#C0392B"></a-box>
      <a-box position="0 0.7 0" width="1.8" height="0.7" depth="1.6" color="#111111"></a-box>
      <a-sphere position="-1.7 0.1 0.5" radius="0.15" color="#FFFDD0"></a-sphere>
      <a-sphere position="-1.7 0.1 -0.5" radius="0.15" color="#FFFDD0"></a-sphere>
    </a-entity>

    <!-- Car 2 with Positional 3D Sound -->
    <a-entity id="car2" position="-30 0.6 -11.5"
              animation="property: position; to: 30 0.6 -11.5; loop: true; dur: 8000; easing: linear"
              sound="src: #engine-sound; autoplay: true; loop: true; volume: 0.5; positional: true; distanceModel: linear; maxDistance: 40">
      <a-box width="3.8" height="1.1" depth="1.8" color="#2980B9"></a-box>
      <a-box position="0 0.7 0" width="2.0" height="0.7" depth="1.6" color="#222222"></a-box>
      <a-sphere position="1.9 0.1 0.5" radius="0.15" color="#FFFDD0"></a-sphere>
      <a-sphere position="1.9 0.1 -0.5" radius="0.15" color="#FFFDD0"></a-sphere>
    </a-entity>

    <!-- Birds Overhead -->
    <a-entity position="0 12 -12" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      <a-entity position="6 0 0">
        <a-cone position="-0.3 0 0" rotation="0 0 70" radius-bottom="0.05" radius-top="0.01" height="0.8" color="#111"></a-cone>
        <a-cone position="0.3 0 0" rotation="0 0 -70" radius-bottom="0.05" radius-top="0.01" height="0.8" color="#111"></a-cone>
      </a-entity>
    </a-entity>

    <!-- Camera Rig -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera look-controls>
        <a-plane id="overlay" vision-overlay position="0 0 -0.5" width="2" height="2" material="shader: flat; depthTest: false; depthWrite: false; transparent: true"></a-plane>
        
        <!-- White Semi-Transparent HUD Panel -->
        <a-entity id="hud-panel" position="0 -0.65 -1.8">
          <a-plane color="#FFFFFF" opacity="0.8" width="1.6" height="0.35" position="0 0 -0.01"></a-plane>
          <a-plane color="#2563EB" opacity="0.9" width="1.6" height="0.03" position="0 0.165 0"></a-plane>
          <a-text id="hud-text" value="Condition: 1/12 Normal Vision\n(Press Trigger or A/X to Next)" 
                  align="center" width="1.8" color="#111111"></a-text>
        </a-entity>
      </a-camera>

      <a-entity mode-switcher oculus-touch-controls="hand: right"></a-entity>
      <a-entity mode-switcher oculus-touch-controls="hand: left"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
