<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR Vision Simulator - Bright Morning Park Scene</title>
  
  <!-- A-Frame and Environment Component -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  
  <style>
    /* Styling for desktop floating UI overlay */
    #ui-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.96);
      padding: 16px 20px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(226, 232, 240, 0.9);
      max-width: 320px;
      backdrop-filter: blur(8px);
    }
    #ui-controls h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 700;
      color: #1e40af;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #ui-controls select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #ui-controls select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    #ui-controls p {
      margin: 8px 0 0 0;
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>

  <script>
    AFRAME.registerComponent('vision-overlay', {
      init: function () {
        const el = this.el;
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          opacity: 1
        });

        el.getOrCreateObject3D('mesh').material = material;
        el.setAttribute('material', { shader: 'flat', depthTest: false });

        this.ctx = ctx;
        this.texture = texture;
        this.updateFilter('normal');
      },

      updateFilter: function (mode) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, 1024, 1024);

        if (mode === 'amd') {
          // 2. Macular Degeneration (AMD) - Central scotoma
          const grad = ctx.createRadialGradient(512, 512, 20, 512, 512, 320);
          grad.addColorStop(0, 'rgba(15, 15, 15, 0.98)');
          grad.addColorStop(0.6, 'rgba(40, 40, 40, 0.85)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 320, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'glaucoma') {
          // 3. Glaucoma - Peripheral vision loss
          ctx.fillStyle = 'rgba(0, 0, 0, 0.98)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 100, 512, 512, 360);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 360, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        } else if (mode === 'diabetic') {
          // 4. Diabetic Retinopathy - Multiple scattered dark spots
          ctx.fillStyle = 'rgba(20, 20, 20, 0.88)';
          const spots = [
            [280, 260, 75], [650, 340, 95], [380, 690, 110], 
            [780, 620, 65], [512, 120, 55], [880, 880, 85], [180, 750, 70]
          ];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'cataract') {
          // 5. Cataracts - Yellowish-brown blur and glare film
          ctx.fillStyle = 'rgba(190, 145, 75, 0.42)';
          ctx.fillRect(0, 0, 1024, 1024);
        } else if (mode === 'keratoconus') {
          // 6. Keratoconus - Distorted cone flare overlay
          ctx.fillStyle = 'rgba(235, 243, 255, 0.38)';
          const spots = [[512, 560, 260], [450, 500, 190], [570, 500, 190]];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.ellipse(x, y, r, r * 1.5, Math.PI / 8, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'opacity') {
          // 7. Corneal Opacity - Dense localized clouding/scarring
          ctx.fillStyle = 'rgba(245, 245, 245, 0.94)';
          ctx.beginPath();
          ctx.ellipse(360, 440, 210, 310, Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'fuchs') {
          // 8. Fuchs' Dystrophy - Hazy corneal edema
          ctx.fillStyle = 'rgba(235, 242, 255, 0.48)';
          ctx.fillRect(0, 0, 1024, 1024);
          const grad = ctx.createRadialGradient(512, 512, 60, 512, 512, 460);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 460, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'rp') {
          // 9. Retinitis Pigmentosa - Tunnel vision
          ctx.fillStyle = 'rgba(5, 5, 5, 0.99)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 35, 512, 512, 150);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 150, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        } else if (mode === 'cscr') {
          // 10. Central Serous Chorioretinopathy - Central gray bubble
          const grad = ctx.createRadialGradient(512, 512, 15, 512, 512, 190);
          grad.addColorStop(0, 'rgba(90, 100, 110, 0.75)');
          grad.addColorStop(0.75, 'rgba(150, 160, 170, 0.38)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 190, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'uveitis') {
          // 11. Anterior Uveitis - Bright glare with inflammatory floaters
          ctx.fillStyle = 'rgba(255, 250, 225, 0.35)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.fillStyle = 'rgba(170, 160, 140, 0.65)';
          const cells = [[480, 490, 12], [530, 520, 8], [500, 460, 15], [450, 530, 10], [550, 470, 9]];
          cells.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'dryeye') {
          // 12. Severe Dry Eye - Tear film streaking and smearing
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.fillStyle = 'rgba(215, 225, 235, 0.45)';
          const streaks = [[200, 300, 420, 85], [100, 600, 520, 65], [300, 150, 370, 75]];
          streaks.forEach(([x, y, w, h]) => {
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, Math.PI / 12, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        this.texture.needsUpdate = true;
      }
    });

    AFRAME.registerComponent('mode-switcher', {
      init: function () {
        this.modes = [
          'normal', 'amd', 'glaucoma', 'diabetic', 'cataract', 
          'keratoconus', 'opacity', 'fuchs', 'rp', 'cscr', 'uveitis', 'dryeye'
        ];
        this.index = 0;
        this.labels = {
          'normal': '1/12 Normal Vision',
          'amd': '2/12 Macular Degeneration (AMD)',
          'glaucoma': '3/12 Glaucoma (Peripheral Loss)',
          'diabetic': '4/12 Diabetic Retinopathy',
          'cataract': '5/12 Cataracts (Clouded / Tinted)',
          'keratoconus': '6/12 Keratoconus (Distortion & Flare)',
          'opacity': '7/12 Corneal Opacity / Scarring',
          'fuchs': "8/12 Fuchs' Dystrophy (Corneal Edema)",
          'rp': '9/12 Retinitis Pigmentosa (Tunnel Vision)',
          'cscr': '10/12 Central Serous Chorioretinopathy',
          'uveitis': '11/12 Anterior Uveitis (Photophobia)',
          'dryeye': '12/12 Severe Dry Eye / Keratitis'
        };

        this.nextMode = this.nextMode.bind(this);
        this.setMode = this.setMode.bind(this);

        this.el.addEventListener('triggerdown', this.nextMode);
        this.el.addEventListener('abuttondown', this.nextMode);
        this.el.addEventListener('xbuttondown', this.nextMode);

        const select = document.getElementById('condition-select');
        if (select) {
          select.addEventListener('change', (e) => {
            this.setMode(e.target.value);
          });
        }
      },

      nextMode: function () {
        this.index = (this.index + 1) % this.modes.length;
        const selected = this.modes[this.index];
        this.applyMode(selected);
        
        const select = document.getElementById('condition-select');
        if (select) select.value = selected;
      },

      setMode: function (selectedKey) {
        const foundIdx = this.modes.indexOf(selectedKey);
        if (foundIdx !== -1) {
          this.index = foundIdx;
          this.applyMode(selectedKey);
        }
      },

      applyMode: function (selected) {
        const overlay = document.querySelector('#overlay');
        const text = document.querySelector('#hud-text');
        const clickSound = document.querySelector('#click-sound-entity');

        if (clickSound && clickSound.components.sound) {
          clickSound.components.sound.stopSound();
          clickSound.components.sound.playSound();
        }

        if (overlay && overlay.components['vision-overlay']) {
          overlay.components['vision-overlay'].updateFilter(selected);
        }
        if (text) {
          text.setAttribute('value', `Condition: ${this.labels[selected]}\n(Press Trigger or A/X to Next)`);
        }
      }
    });

    AFRAME.registerComponent('realistic-walker', {
      schema: {
        speed: { type: 'number', default: 1.4 },
        direction: { type: 'number', default: 1 },
        strideFreq: { type: 'number', default: 6.5 }
      },
      init: function () {
        this.leftThigh = this.el.querySelector('.left-thigh');
        this.rightThigh = this.el.querySelector('.right-thigh');
        this.leftShin = this.el.querySelector('.left-shin');
        this.rightShin = this.el.querySelector('.right-shin');

        this.leftUpperArm = this.el.querySelector('.left-upper-arm');
        this.rightUpperArm = this.el.querySelector('.right-upper-arm');
        this.leftForearm = this.el.querySelector('.left-forearm');
        this.rightForearm = this.el.querySelector('.right-forearm');

        this.torso = this.el.querySelector('.torso');
        this.head = this.el.querySelector('.head-group');

        this.time = Math.random() * 100;
        this.initialY = this.el.getAttribute('position').y;
      },
      tick: function (t, dt) {
        if (!dt) return;
        const seconds = dt / 1000;
        let pos = this.el.getAttribute('position');
        pos.x += this.data.speed * this.data.direction * seconds;

        // Loop boundaries on sidewalk
        if (this.data.direction === 1 && pos.x > 32) pos.x = -32;
        if (this.data.direction === -1 && pos.x < -32) pos.x = 32;

        this.time += seconds * this.data.strideFreq;
        const phase = this.time;
        const legSwing = Math.sin(phase);
        const armSwing = Math.sin(phase);

        // Vertical bobbing during step phase
        pos.y = this.initialY + Math.abs(Math.sin(phase * 2)) * 0.04;
        this.el.setAttribute('position', pos);

        // Realistic Leg Joint Kinematics (Hip + Knee flexion)
        if (this.leftThigh) {
          const lHipRot = legSwing * 28;
          const lKneeRot = legSwing < 0 ? Math.sin(-legSwing * Math.PI) * 40 : 5;
          this.leftThigh.setAttribute('rotation', `${lHipRot} 0 0`);
          if (this.leftShin) this.leftShin.setAttribute('rotation', `${-lKneeRot} 0 0`);
        }

        if (this.rightThigh) {
          const rHipRot = -legSwing * 28;
          const rKneeRot = legSwing > 0 ? Math.sin(legSwing * Math.PI) * 40 : 5;
          this.rightThigh.setAttribute('rotation', `${rHipRot} 0 0`);
          if (this.rightShin) this.rightShin.setAttribute('rotation', `${-rKneeRot} 0 0`);
        }

        // Realistic Arm Joint Kinematics (Shoulder + Elbow flexion)
        if (this.leftUpperArm) {
          const lShoulderRot = -armSwing * 22;
          this.leftUpperArm.setAttribute('rotation', `${lShoulderRot} 0 -5`);
          if (this.leftForearm) this.leftForearm.setAttribute('rotation', `-18 0 0`);
        }

        if (this.rightUpperArm) {
          const rShoulderRot = armSwing * 22;
          this.rightUpperArm.setAttribute('rotation', `${rShoulderRot} 0 5`);
          if (this.rightForearm) this.rightForearm.setAttribute('rotation', `-18 0 0`);
        }

        // Subtle torso twist & head stabilizing counter-rotation
        if (this.torso) {
          this.torso.setAttribute('rotation', `0 ${Math.sin(phase) * 4} 0`);
        }
        if (this.head) {
          this.head.setAttribute('rotation', `0 ${-Math.sin(phase) * 3} 0`);
        }
      }
    });
  </script>
</head>
<body>

  <!-- Floating UI Panel -->
  <div id="ui-controls">
    <h3>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path></svg>
      Vision Simulator VR
    </h3>
    <select id="condition-select">
      <option value="normal">1/12 Normal Vision</option>
      <option value="amd">2/12 Macular Degeneration (AMD)</option>
      <option value="glaucoma">3/12 Glaucoma (Peripheral Loss)</option>
      <option value="diabetic">4/12 Diabetic Retinopathy</option>
      <option value="cataract">5/12 Cataracts</option>
      <option value="keratoconus">6/12 Keratoconus</option>
      <option value="opacity">7/12 Corneal Opacity / Scarring</option>
      <option value="fuchs">8/12 Fuchs' Dystrophy</option>
      <option value="rp">9/12 Retinitis Pigmentosa</option>
      <option value="cscr">10/12 Central Serous Chorioretinopathy</option>
      <option value="uveitis">11/12 Anterior Uveitis</option>
      <option value="dryeye">12/12 Severe Dry Eye</option>
    </select>
    <p>Press <b>Trigger</b> or <b>A/X button</b> on VR controllers to cycle conditions.</p>
  </div>

  <a-scene>
    <a-assets>
      <audio id="click-sound" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg" crossorigin="anonymous"></audio>
      <audio id="engine-sound" src="https://cdn.freesound.org/previews/387/387602_5121236-lq.mp3" crossorigin="anonymous"></audio>
      <audio id="ambient-sound" src="https://cdn.freesound.org/previews/416/416529_5121236-lq.mp3" crossorigin="anonymous"></audio>
    </a-assets>

    <!-- Global Sound Effects -->
    <a-entity sound="src: #ambient-sound; autoplay: true; loop: true; volume: 0.35"></a-entity>
    <a-entity id="click-sound-entity" sound="src: #click-sound; autoplay: false; volume: 0.8"></a-entity>

    <a-light type="directional" color="#FFF8E7" intensity="1.45" position="0 12 6" castShadow="true"></a-light>
    <a-light type="ambient" color="#E0F2FE" intensity="0.85"></a-light>

    <!-- Environment Preset -->
    <a-entity environment="preset: forest; skyType: atmosphere; skyColor: #87CEEB; horizonColor: #E0F6FF; lightPosition: 0 1 0.5; dressingAmount: 65; playArea: 1.5; fog: 0.001; groundColor: #388E3C; groundColor2: #4CAF50"></a-entity>

    <a-plane position="0 0.01 -6.5" rotation="-90 0 0" width="100" height="3.5" color="#E2E8F0"></a-plane>
    <a-box position="0 0.08 -4.75" width="100" height="0.15" depth="0.2" color="#CBD5E1"></a-box>

    <!-- Asphalt Road with Center Line -->
    <a-plane position="0 0.01 -11" rotation="-90 0 0" width="100" height="8.5" color="#334155"></a-plane>
    <a-plane position="0 0.02 -11" rotation="-90 0 0" width="100" height="0.25" color="#FACD15"></a-plane>

    <!-- Moving Vehicle 1 (Red Sedan) -->
    <a-entity id="car1" position="32 0.65 -9.2"
              animation="property: position; to: -32 0.65 -9.2; loop: true; dur: 6500; easing: linear"
              sound="src: #engine-sound; autoplay: true; loop: true; volume: 0.6; positional: true; distanceModel: linear; maxDistance: 45">
      <a-box width="3.6" height="1.1" depth="1.8" color="#DC2626" radius="0.1"></a-box>
      <a-box position="0 0.7 0" width="1.9" height="0.75" depth="1.6" color="#0F172A"></a-box>
      <a-sphere position="-1.75 0.1 0.55" radius="0.16" color="#FEF08A"></a-sphere>
      <a-sphere position="-1.75 0.1 -0.55" radius="0.16" color="#FEF08A"></a-sphere>
    </a-entity>

    <!-- Moving Vehicle 2 (Blue SUV) -->
    <a-entity id="car2" position="-32 0.65 -12.8"
              animation="property: position; to: 32 0.65 -12.8; loop: true; dur: 8500; easing: linear"
              sound="src: #engine-sound; autoplay: true; loop: true; volume: 0.5; positional: true; distanceModel: linear; maxDistance: 45">
      <a-box width="4.0" height="1.2" depth="1.9" color="#0284C7" radius="0.1"></a-box>
      <a-box position="0 0.75 0" width="2.1" height="0.75" depth="1.7" color="#1E293B"></a-box>
      <a-sphere position="1.95 0.1 0.55" radius="0.16" color="#FEF08A"></a-sphere>
      <a-sphere position="1.95 0.1 -0.55" radius="0.16" color="#FEF08A"></a-sphere>
    </a-entity>

    <a-entity realistic-walker="speed: 1.35; direction: 1" position="-14 0 -6.1" rotation="0 90 0">
      <a-entity class="torso" position="0 1.05 0">
        <!-- Jacket & Shirt -->
        <a-box width="0.42" height="0.55" depth="0.26" color="#1E3A8A" radius="0.03"></a-box>
        <a-cylinder position="0 0.22 0.08" radius="0.06" height="0.18" color="#FFFFFF" rotation="15 0 0"></a-cylinder>

        <!-- Head, Face & Hair -->
        <a-entity class="head-group" position="0 0.42 0">
          <a-sphere radius="0.125" color="#D2A679"></a-sphere>
          <a-cone position="0 0.01 0.12" rotation="90 0 0" radius-bottom="0.025" radius-top="0.005" height="0.05" color="#C19568"></a-cone>
          <!-- Hair & Ears -->
          <a-sphere position="0 0.06 -0.02" radius="0.13" color="#261C14" scale="1 0.75 1.02"></a-sphere>
          <a-cylinder position="0.125 0 0" rotation="0 0 90" radius="0.03" height="0.02" color="#D2A679"></a-cylinder>
          <a-cylinder position="-0.125 0 0" rotation="0 0 90" radius="0.03" height="0.02" color="#D2A679"></a-cylinder>
        </a-entity>

        <!-- Arms (Upper + Forearm + Hands) -->
        <a-entity class="left-upper-arm" position="-0.24 0.2 0">
          <a-cylinder position="0 -0.15 0" radius="0.05" height="0.3" color="#1E3A8A"></a-cylinder>
          <a-entity class="left-forearm" position="0 -0.3 0">
            <a-cylinder position="0 -0.14 0" radius="0.042" height="0.28" color="#D2A679"></a-cylinder>
            <a-sphere position="0 -0.29 0" radius="0.04" color="#D2A679"></a-sphere>
          </a-entity>
        </a-entity>

        <a-entity class="right-upper-arm" position="0.24 0.2 0">
          <a-cylinder position="0 -0.15 0" radius="0.05" height="0.3" color="#1E3A8A"></a-cylinder>
          <a-entity class="right-forearm" position="0 -0.3 0">
            <a-cylinder position="0 -0.14 0" radius="0.042" height="0.28" color="#D2A679"></a-cylinder>
            <a-sphere position="0 -0.29 0" radius="0.04" color="#D2A679"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Hips & Legs -->
      <a-box position="0 0.75 0" width="0.38" height="0.12" depth="0.24" color="#374151"></a-box>
      
      <!-- Left Leg (Thigh + Shin + Shoe) -->
      <a-entity class="left-thigh" position="-0.11 0.7 0">
        <a-cylinder position="0 -0.18 0" radius="0.065" height="0.36" color="#374151"></a-cylinder>
        <a-entity class="left-shin" position="0 -0.36 0">
          <a-cylinder position="0 -0.18 0" radius="0.052" height="0.36" color="#374151"></a-cylinder>
          <!-- Shoe -->
          <a-box position="0 -0.38 0.05" width="0.1" height="0.08" depth="0.22" color="#1F2937" radius="0.01"></a-box>
        </a-entity>
      </a-entity>

      <!-- Right Leg (Thigh + Shin + Shoe) -->
      <a-entity class="right-thigh" position="0.11 0.7 0">
        <a-cylinder position="0 -0.18 0" radius="0.065" height="0.36" color="#374151"></a-cylinder>
        <a-entity class="right-shin" position="0 -0.36 0">
          <a-cylinder position="0 -0.18 0" radius="0.052" height="0.36" color="#374151"></a-cylinder>
          <!-- Shoe -->
          <a-box position="0 -0.38 0.05" width="0.1" height="0.08" depth="0.22" color="#1F2937" radius="0.01"></a-box>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity realistic-walker="speed: 1.4; direction: -1" position="16 0 -6.8" rotation="0 -90 0">
      <a-entity class="torso" position="0 1.02 0">
        <!-- Blouse & Skirt -->
        <a-box width="0.36" height="0.48" depth="0.22" color="#E11D48" radius="0.03"></a-box>
        <a-cone position="0 -0.32 0" radius-bottom="0.26" radius-top="0.18" height="0.3" color="#BE123C"></a-cone>

        <!-- Head, Hair & Features -->
        <a-entity class="head-group" position="0 0.38 0">
          <a-sphere radius="0.115" color="#8D5524"></a-sphere>
          <!-- Long Hair Style -->
          <a-sphere position="0 0.04 -0.03" radius="0.13" color="#1C1917" scale="1.05 0.95 1.1"></a-sphere>
          <a-cylinder position="0 -0.1 -0.08" radius="0.11" height="0.28" color="#1C1917"></a-cylinder>
        </a-entity>

        <!-- Arms -->
        <a-entity class="left-upper-arm" position="-0.21 0.18 0">
