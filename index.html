<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebVR Vision Simulator</title>

  <!-- A-Frame VR Framework & Environment Component -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  
  <!-- Tailwind CSS for UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
    }
  </style>

  <script>
    // Custom VR Thumbstick Locomotion & Snap Turn Component using direct WebXR Session Input Sources
    AFRAME.registerComponent('vr-locomotion', {
      schema: {
        speed: { type: 'number', default: 2.2 },
        snapAngle: { type: 'number', default: 30 },
        deadzone: { type: 'number', default: 0.18 }
      },
      init: function () {
        this.canSnap = true;
        this.rig = this.el; // Attach to #rig
        this.camera = document.querySelector('#head');
        
        // Cache vectors to avoid garbage collection overhead in tick loop
        this.dirVector = new THREE.Vector3();
        this.sideVector = new THREE.Vector3();
        this.upVector = new THREE.Vector3(0, 1, 0);
      },

      tick: function (time, timeDelta) {
        if (!timeDelta || !this.rig || !this.camera) return;

        const dt = Math.min(timeDelta, 100) / 1000;
        const speed = this.data.speed * dt;
        const deadzone = this.data.deadzone;

        let moveX = 0;
        let moveY = 0;
        let snapX = 0;

        // 1. Primary Method: Access WebXR active session inputSources directly from renderer
        const sceneEl = this.el.sceneEl;
        const xrSession = sceneEl.renderer && sceneEl.renderer.xr ? sceneEl.renderer.xr.getSession() : null;

        if (xrSession && xrSession.inputSources) {
          for (let source of xrSession.inputSources) {
            if (!source.gamepad || !source.gamepad.axes) continue;

            const gp = source.gamepad;
            const axes = gp.axes;

            // Touch / Quest standard axes: [0]: touchX, [1]: touchY, [2]: thumbX, [3]: thumbY
            let axisX = axes.length >= 4 && Math.abs(axes[2]) > 0.05 ? axes[2] : (axes[0] || 0);
            let axisY = axes.length >= 4 && Math.abs(axes[3]) > 0.05 ? axes[3] : (axes[1] || 0);

            if (source.handedness === 'left') {
              if (Math.abs(axisX) > deadzone) moveX = axisX;
              if (Math.abs(axisY) > deadzone) moveY = axisY;
            } else if (source.handedness === 'right') {
              if (Math.abs(axisX) > deadzone) snapX = axisX;
            }
          }
        } else if (navigator.getGamepads) {
          // 2. Fallback Method: Standard Navigator Gamepad API
          const gamepads = navigator.getGamepads();
          for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (!gp || !gp.axes) continue;

            let axisX = gp.axes.length >= 4 && Math.abs(gp.axes[2]) > 0.05 ? gp.axes[2] : (gp.axes[0] || 0);
            let axisY = gp.axes.length >= 4 && Math.abs(gp.axes[3]) > 0.05 ? gp.axes[3] : (gp.axes[1] || 0);

            const hand = gp.hand || (gp.id && gp.id.toLowerCase().includes('left') ? 'left' : (gp.id && gp.id.toLowerCase().includes('right') ? 'right' : ''));

            if (hand === 'left' || (!hand && i === 0)) {
              if (Math.abs(axisX) > deadzone) moveX = axisX;
              if (Math.abs(axisY) > deadzone) moveY = axisY;
            } else if (hand === 'right' || (!hand && i === 1)) {
              if (Math.abs(axisX) > deadzone) snapX = axisX;
            }
          }
        }

        // --- Apply Continuous Translation (Left Stick) relative to Head Yaw ---
        if (Math.abs(moveX) > 0 || Math.abs(moveY) > 0) {
          const camObj = this.camera.object3D;
          camObj.getWorldDirection(this.dirVector);
          
          // Invert world direction because Three.js camera looks down -Z
          this.dirVector.y = 0; 
          this.dirVector.normalize();

          // Calculate right side direction vector for strafing
          this.sideVector.crossVectors(this.upVector, this.dirVector).normalize();

          // Apply displacement directly to Three.js Object3D Position
          const rigObj = this.rig.object3D;
          rigObj.position.x += (this.dirVector.x * -moveY + this.sideVector.x * moveX) * speed;
          rigObj.position.z += (this.dirVector.z * -moveY + this.sideVector.z * moveX) * speed;
        }

        // --- Apply Snap Turning (Right Stick) ---
        if (Math.abs(snapX) > 0.6) {
          if (this.canSnap) {
            this.canSnap = false;
            const rigObj = this.rig.object3D;
            const angleRad = THREE.MathUtils.degToRad(snapX > 0 ? -this.data.snapAngle : this.data.snapAngle);
            rigObj.rotation.y += angleRad;
          }
        } else if (Math.abs(snapX) < 0.25) {
          this.canSnap = true; // Reset snap threshold lock when stick returns to neutral
        }
      }
    });

    // Dynamic 2D Canvas Vision Loss Filter Component
    AFRAME.registerComponent('vision-overlay', {
      init: function () {
        const el = this.el;
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d', { alpha: true });

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          opacity: 1
        });

        const mesh = el.getOrCreateObject3D('mesh');
        mesh.material = material;

        this.canvas = canvas;
        this.ctx = ctx;
        this.texture = texture;
        this.currentMode = 'normal';

        // Inertial physics variables for floaters & metamorphopsia
        this.lastRotation = new THREE.Euler();
        this.cameraObj = null;
        this.floaterVelX = 0;
        this.floaterVelY = 0;
        this.floaterPosX = 512;
        this.floaterPosY = 512;

        this.glareIntensity = 0;
        this.snowSeed = 0;

        this.updateFilter('normal');
      },

      tick: function (time, timeDelta) {
        if (!timeDelta) return;
        const dt = Math.min(timeDelta, 100) / 1000;

        if (!this.cameraObj) {
          const cameraEl = document.querySelector('#head');
          if (cameraEl) this.cameraObj = cameraEl.object3D;
        }

        let needsRedraw = false;

        // Head Inertia Physics for Floaters & Visual Distortion Drift
        if (this.cameraObj) {
          const currentRot = this.cameraObj.rotation;
          const rotDiffY = currentRot.y - this.lastRotation.y;
          const rotDiffX = currentRot.x - this.lastRotation.x;

          this.floaterVelX += rotDiffY * 2200;
          this.floaterVelY -= rotDiffX * 2200;

          this.lastRotation.copy(currentRot);

          this.floaterVelX *= 0.91;
          this.floaterVelY *= 0.91;

          this.floaterPosX += this.floaterVelX * dt;
          this.floaterPosY += this.floaterVelY * dt;

          this.floaterPosX += (512 - this.floaterPosX) * 1.5 * dt;
          this.floaterPosY += (512 - this.floaterPosY) * 1.5 * dt;

          if (Math.abs(this.floaterVelX) > 0.5 || Math.abs(this.floaterVelY) > 0.5) {
            needsRedraw = true;
          }
        }

        if (this.currentMode === 'visualsnow') {
          this.snowSeed = Math.random();
          needsRedraw = true;
        }

        // Night Vehicle Headlight Glare & Photophobia Simulation
        const car1 = document.querySelector('#car1');
        const envComponent = document.querySelector('a-scene')?.components['environment'];
        const isNight = envComponent && (envComponent.data.preset === 'night' || envComponent.data.preset === 'sunset');

        if (isNight && car1 && this.cameraObj) {
          const carPos = car1.object3D.position;
          const camPos = this.cameraObj.position;
          const dist = carPos.distanceTo(camPos);

          if (dist < 22) {
            this.glareIntensity = Math.min(1.0, (22 - dist) / 18);
            needsRedraw = true;
          } else if (this.glareIntensity > 0) {
            this.glareIntensity = 0;
            needsRedraw = true;
          }
        } else if (this.glareIntensity > 0) {
          this.glareIntensity = 0;
          needsRedraw = true;
        }

        if (needsRedraw) {
          this.updateFilter(this.currentMode);
        }
      },

      updateFilter: function (mode) {
        this.currentMode = mode;
        const ctx = this.ctx;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, 1024, 1024);

        const fx = this.floaterPosX;
        const fy = this.floaterPosY;
        const glare = this.glareIntensity;

        if (mode === 'amd') {
          // 1. Age-related Macular Degeneration (AMD)
          const grad = ctx.createRadialGradient(512, 512, 10, 512, 512, 280);
          grad.addColorStop(0, 'rgba(15, 12, 10, 0.98)');
          grad.addColorStop(0.6, 'rgba(35, 28, 20, 0.9)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 280, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'glaucoma') {
          // 2. Glaucoma (Peripheral Tunnel Vision)
          ctx.fillStyle = 'rgba(5, 5, 5, 0.98)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 120, 512, 512, 350);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 350, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'cataract') {
          // 3. Cataracts (Yellowed Haze + Photophobia Glare)
          ctx.fillStyle = `rgba(195, 155, 75, ${0.42 + glare * 0.25})`;
          ctx.fillRect(0, 0, 1024, 1024);

          if (glare > 0) {
            const grad = ctx.createRadialGradient(512, 512, 20, 512, 512, 450);
            grad.addColorStop(0, `rgba(255, 255, 220, ${glare * 0.85})`);
            grad.addColorStop(0.5, `rgba(255, 200, 100, ${glare * 0.5})`);
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(512, 512, 450, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (mode === 'diabetic') {
          // 4. Diabetic Retinopathy (Patchy Scotoma Spots)
          ctx.fillStyle = 'rgba(15, 10, 5, 0.88)';
          const spots = [
            [fx - 212, fy - 262, 75], [fx + 128, fy - 152, 95], 
            [fx - 112, fy + 168, 105], [fx + 248, fy + 128, 65], 
            [fx, fy - 392, 55], [fx + 368, fy + 368, 85]
          ];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'rp') {
          // 5. Retinitis Pigmentosa (Severe Tunnel Vision)
          ctx.fillStyle = 'rgba(5, 5, 5, 0.99)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.globalCompositeOperation = 'destination-out';
          const grad = ctx.createRadialGradient(512, 512, 35, 512, 512, 150);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(512, 512, 150, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'keratoconus') {
          // 6. Keratoconus (Monocular Polyopia / Ghosting)
          const shiftX = (fx - 512) * 0.35;
          const shiftY = (fy - 512) * 0.35;

          ctx.fillStyle = `rgba(235, 242, 255, ${0.38 + glare * 0.3})`;
          const spots = [
            [512 + shiftX, 560 + shiftY, 260], 
            [450 - shiftX, 500 - shiftY, 190], 
            [570 + shiftX, 500 + shiftY, 190]
          ];
          spots.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.ellipse(x, y, r, r * 1.5, Math.PI / 7, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'uveitis') {
          // 7. Anterior Uveitis (Inflammatory Cell Debris / Floaters)
          ctx.fillStyle = `rgba(255, 248, 225, ${0.35 + glare * 0.45})`;
          ctx.fillRect(0, 0, 1024, 1024);

          ctx.fillStyle = 'rgba(170, 160, 140, 0.75)';
          const cells = [
            [fx - 32, fy - 22, 14], [fx + 18, fy + 8, 9], 
            [fx - 12, fy - 52, 16], [fx - 62, fy + 18, 11], 
            [fx + 38, fy - 42, 10], [fx - 92, fy - 72, 8]
          ];
          cells.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (mode === 'cscr') {
          // 8. Central Serous Chorioretinopathy (CSCR)
          const grad = ctx.createRadialGradient(fx, fy, 20, fx, fy, 190);
          grad.addColorStop(0, 'rgba(90, 100, 110, 0.72)');
          grad.addColorStop(0.85, 'rgba(150, 160, 170, 0.35)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(fx, fy, 190, 0, Math.PI * 2);
          ctx.fill();
        } else if (mode === 'hemianopia') {
          // 9. Hemianopia (Half Visual Field Loss)
          ctx.fillStyle = 'rgba(10, 10, 10, 0.98)';
          ctx.beginPath();
          ctx.rect(0, 0, 512, 1024);
          ctx.fill();
        } else if (mode === 'visualsnow') {
          // 10. Visual Snow Syndrome
          const imgData = ctx.createImageData(1024, 1024);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            const v = Math.random() > 0.5 ? 255 : 0;
            data[i] = v;
            data[i + 1] = v;
            data[i + 2] = v;
            data[i + 3] = 45;
          }
          ctx.putImageData(imgData, 0, 0);
        } else if (mode === 'cvd') {
          // 11. Color Vision Deficiency
          ctx.fillStyle = 'rgba(180, 160, 90, 0.38)';
          ctx.fillRect(0, 0, 1024, 1024);
        } else if (mode === 'dryeye') {
          // 12. Severe Dry Eye (Keratitis)
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.fillRect(0, 0, 1024, 1024);
          ctx.fillStyle = 'rgba(210, 220, 235, 0.45)';
          const streaks = [[200, 300, 420, 85], [100, 600, 520, 65], [300, 150, 380, 75]];
          streaks.forEach(([x, y, w, h]) => {
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, Math.PI / 12, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.restore();
        this.texture.needsUpdate = true;
      }
    });

    // Controller Trigger Mode Switcher & Web Audio Synthesizer
    AFRAME.registerComponent('mode-switcher', {
      init: function () {
        this.modes = [
          'normal', 'amd', 'glaucoma', 'cataract', 'diabetic', 
          'rp', 'keratoconus', 'uveitis', 'cscr', 'hemianopia', 'visualsnow', 'cvd', 'dryeye'
        ];
        this.index = 0;
        this.labels = {
          'normal': '1/13 Normal Vision',
          'amd': '2/13 Macular Degeneration (AMD)',
          'glaucoma': '3/13 Glaucoma (Peripheral Loss)',
          'cataract': '4/13 Cataracts (Clouded / Tinted)',
          'diabetic': '5/13 Diabetic Retinopathy',
          'rp': '6/13 Retinitis Pigmentosa (Tunnel)',
          'keratoconus': '7/13 Keratoconus (Distortion)',
          'uveitis': '8/13 Anterior Uveitis (Photophobia)',
          'cscr': '9/13 Central Serous Chorioretinopathy',
          'hemianopia': '10/13 Hemianopia (Half Loss)',
          'visualsnow': '11/13 Visual Snow Syndrome',
          'cvd': '12/13 Color Vision Deficiency',
          'dryeye': '13/13 Severe Dry Eye (Keratitis)'
        };

        this.nextMode = this.nextMode.bind(this);
        this.setMode = this.setMode.bind(this);

        // Bind controller buttons for trigger cycling
        this.el.addEventListener('triggerdown', this.nextMode);
        this.el.addEventListener('selectstart', this.nextMode);
        this.el.addEventListener('abuttondown', this.nextMode);
        this.el.addEventListener('xbuttondown', this.nextMode);

        const select = document.getElementById('condition-select');
        if (select) {
          select.addEventListener('change', (e) => {
            this.setMode(e.target.value);
          });
        }
      },

      playAudioClick: function() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
          }
        } catch(e) {}
      },

      nextMode: function () {
        this.index = (this.index + 1) % this.modes.length;
        const selected = this.modes[this.index];
        this.applyMode(selected);
        
        const select = document.getElementById('condition-select');
        if (select) select.value = selected;
      },

      setMode: function (selectedKey) {
        const foundIdx = this.modes.indexOf(selectedKey);
        if (foundIdx !== -1) {
          this.index = foundIdx;
          this.applyMode(selectedKey);
        }
      },

      applyMode: function (selected) {
        const overlay = document.querySelector('#overlay');
        const text = document.querySelector('#hud-text');

        this.playAudioClick();

        if (overlay && overlay.components['vision-overlay']) {
          overlay.components['vision-overlay'].updateFilter(selected);
        }
        if (text) {
          text.setAttribute('value', `Condition: ${this.labels[selected] || selected}`);
        }
      }
    });

    // Crosswalk Mini-Game Tracker
    AFRAME.registerComponent('crosswalk-tracker', {
      tick: function () {
        const rig = document.querySelector('#rig');
        const car1 = document.querySelector('#car1');
        const statusText = document.querySelector('#game-status-text');
        if (!rig || !statusText || !window.isMiniGameActive) return;

        const pos = rig.object3D.position;
        const z = pos.z;
        const x = pos.x;

        if (z < -3.0 && z > -11.0) {
          if (car1) {
            const carPos = car1.object3D.position;
            const distToCar = Math.abs(carPos.x - x);
            
            if (distToCar < 4.5) {
              statusText.setAttribute('value', 'WARNING! Incoming vehicle close! Stop!');
              statusText.setAttribute('color', '#EF4444');
              return;
            }
          }
          statusText.setAttribute('value', 'Crossing... Watch left & right for traffic!');
          statusText.setAttribute('color', '#F59E0B');
        } else if (z <= -11.0) {
          statusText.setAttribute('value', 'SUCCESS! You crossed safely to the far sidewalk!');
          statusText.setAttribute('color', '#10B981');
        } else {
          statusText.setAttribute('value', 'Use joystick/WASD to walk forward onto crosswalk.');
          statusText.setAttribute('color', '#94A3B8');
        }
      }
    });

    // Realistic Pedestrian Walking Component
    AFRAME.registerComponent('realistic-walker', {
      schema: {
        speed: { type: 'number', default: 1.2 },
        direction: { type: 'number', default: 1 }
      },
      init: function () {
        this.leftThigh = this.el.querySelector('.left-thigh');
        this.rightThigh = this.el.querySelector('.right-thigh');
        this.leftShin = this.el.querySelector('.left-shin');
        this.rightShin = this.el.querySelector('.right-shin');
        this.leftArm = this.el.querySelector('.left-arm');
        this.rightArm = this.el.querySelector('.right-arm');
        this.torso = this.el.querySelector('.torso');
        this.time = Math.random() * 100;
      },
      tick: function (t, dt) {
        if (!dt) return;
        
        const deltaSec = Math.min(dt, 100) / 1000;
        let pos = this.el.getAttribute('position');
        pos.x += this.data.speed * this.data.direction * deltaSec;

        if (this.data.direction === 1 && pos.x > 25) pos.x = -25;
        if (this.data.direction === -1 && pos.x < -25) pos.x = 25;

        this.time += deltaSec * 4.5;
        pos.y = Math.abs(Math.sin(this.time)) * 0.04;
        
        this.el.setAttribute('position', pos);

        const legSwing = Math.sin(this.time) * 22;
        const kneeBend = Math.max(0, Math.sin(this.time + Math.PI / 4) * 20);
        const altKneeBend = Math.max(0, Math.sin(this.time - Math.PI / 4) * 20);

        if (this.leftThigh) this.leftThigh.setAttribute('rotation', `${legSwing} 0 0`);
        if (this.rightThigh) this.rightThigh.setAttribute('rotation', `${-legSwing} 0 0`);
        if (this.leftShin) this.leftShin.setAttribute('rotation', `${kneeBend} 0 0`);
        if (this.rightShin) this.rightShin.setAttribute('rotation', `${altKneeBend} 0 0`);
        
        if (this.leftArm) this.leftArm.setAttribute('rotation', `${-legSwing * 0.7} 0 0`);
        if (this.rightArm) this.rightArm.setAttribute('rotation', `${legSwing * 0.7} 0 0`);
        if (this.torso) this.torso.setAttribute('rotation', `0 ${Math.sin(this.time) * 3} 0`);
      }
    });

    window.isMiniGameActive = false;

    window.setEnvironmentPreset = function (presetName) {
      const envEl = document.querySelector('[environment]');
      const headLights = document.querySelectorAll('.headlight');

      if (presetName === 'morning') {
        envEl.setAttribute('environment', {
          preset: 'forest', skyType: 'atmosphere', skyColor: '#87CEEB', horizonColor: '#E0F6FF',
          lightPosition: { x: 0, y: 1, z: 0.5 }, dressingAmount: 55, fog: 0.04
        });
        headLights.forEach(hl => hl.setAttribute('visible', 'false'));
      } else if (presetName === 'dusk') {
        envEl.setAttribute('environment', {
          preset: 'sunset', skyType: 'gradient', horizonColor: '#FDBA74',
          lightPosition: { x: -0.8, y: 0.2, z: -0.5 }, dressingAmount: 55, fog: 0.08
        });
        headLights.forEach(hl => hl.setAttribute('visible', 'true'));
      } else if (presetName === 'night') {
        envEl.setAttribute('environment', {
          preset: 'night', skyType: 'gradient', horizonColor: '#0F172A',
          lightPosition: { x: 0, y: -1, z: 0 }, dressingAmount: 55, fog: 0.12
        });
        headLights.forEach(hl => hl.setAttribute('visible', 'true'));
      }
    };

    window.toggleGameMode = function (toggleVal) {
      const modeText = document.querySelector('#game-mode-text');
      const btnText = document.querySelector('#mode-btn-text');
      const statusText = document.querySelector('#game-status-text');
      const rig = document.querySelector('#rig');

      if (typeof toggleVal === 'boolean') {
        window.isMiniGameActive = toggleVal;
      } else {
        window.isMiniGameActive = !window.isMiniGameActive;
      }

      if (window.isMiniGameActive) {
        if (modeText) modeText.setAttribute('value', 'Mode: Crosswalk Game Active');
        if (btnText) btnText.setAttribute('value', 'Switch to Explore');
        if (statusText) {
          statusText.setAttribute('value', 'Use joystick/WASD to walk forward onto crosswalk.');
          statusText.setAttribute('color', '#94A3B8');
        }
        if (rig) rig.setAttribute('position', '0 1.6 2.0');
      } else {
        if (modeText) modeText.setAttribute('value', 'Mode: Free Explore (Idle)');
        if (btnText) btnText.setAttribute('value', 'Start Game');
        if (statusText) {
          statusText.setAttribute('value', 'Free Exploration - Use joystick to navigate.');
          statusText.setAttribute('color', '#94A3B8');
        }
      }
    };
  </script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">

  <!-- Desktop Control UI Panel -->
  <div class="fixed bottom-4 left-4 z-[9999] w-80 bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-2xl border border-white/20 text-slate-900 transition-all duration-300 hover:bg-white">
    <div class="flex items-center space-x-2.5 mb-2.5">
      <div class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></div>
      <h3 class="font-bold text-sm tracking-tight text-blue-600">VR Vision Simulator</h3>
    </div>
    
    <label for="condition-select" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">
      1. Select Vision Condition
    </label>
    <select id="condition-select" class="w-full px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 focus:bg-white border border-slate-300 rounded-lg text-slate-800 text-xs font-medium transition-all outline-none focus:ring-2 focus:ring-blue-500 mb-2.5">
      <option value="normal">1. Normal Vision</option>
      <option value="amd">2. Macular Degeneration (AMD)</option>
      <option value="glaucoma">3. Glaucoma (Peripheral Loss)</option>
      <option value="cataract">4. Cataracts (Clouded / Tinted)</option>
      <option value="diabetic">5. Diabetic Retinopathy</option>
      <option value="rp">6. Retinitis Pigmentosa (Tunnel)</option>
      <option value="keratoconus">7. Keratoconus (Distortion & Flare)</option>
      <option value="uveitis">8. Anterior Uveitis (Photophobia)</option>
      <option value="cscr">9. Central Serous Chorioretinopathy</option>
      <option value="hemianopia">10. Hemianopia (Half Loss)</option>
      <option value="visualsnow">11. Visual Snow Syndrome</option>
      <option value="cvd">12. Color Vision Deficiency</option>
      <option value="dryeye">13. Severe Dry Eye (Keratitis)</option>
    </select>

    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">
      2. Environment Time of Day
    </label>
    <div class="grid grid-cols-3 gap-1 mb-2.5">
      <button onclick="setEnvironmentPreset('morning')" class="px-2 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-md text-[11px] font-medium text-slate-700 transition-all">Day</button>
      <button onclick="setEnvironmentPreset('dusk')" class="px-2 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-md text-[11px] font-medium text-slate-700 transition-all">Dusk</button>
      <button onclick="setEnvironmentPreset('night')" class="px-2 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-md text-[11px] font-medium text-slate-700 transition-all">Night</button>
    </div>

    <div class="pt-2 border-t border-slate-200 text-[10px] text-slate-500 flex items-center justify-between">
      <span>VR Controls:</span>
      <span class="font-semibold text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded">Left Stick: Walk / Right Stick: Snap Turn</span>
    </div>
  </div>

  <!-- A-Frame 3D Scene Structure -->
  <a-scene render-order="background, terrain, dynamic, overlay">

    <!-- Dynamic Environment -->
    <a-entity environment="preset: forest; skyType: atmosphere; skyColor: #87CEEB; horizonColor: #E0F6FF; lightPosition: 0 1 0.5; dressingAmount: 55; playArea: 1.5; fog: 0.04"></a-entity>
    <a-entity light="type: ambient; color: #E0F2FE; intensity: 0.85"></a-entity>
    <a-entity light="type: directional; color: #FFFDF0; intensity: 1.25" position="-10 20 15"></a-entity>

    <!-- Sidewalk & Road Geometry -->
    <a-entity id="ground-surfaces">
      <!-- Asphalt Road -->
      <a-plane position="0 0.01 -6" rotation="-90 0 0" width="100" height="8" 
               material="color: #1E293B; roughness: 0.9; depthTest: true; depthWrite: true"></a-plane>

      <!-- Pedestrian Near Sidewalk -->
      <a-plane position="0 0.02 1.5" rotation="-90 0 0" width="100" height="5" 
               material="color: #CBD5E1; roughness: 0.8; depthTest: true; depthWrite: true"></a-plane>

      <!-- Far Sidewalk -->
      <a-plane position="0 0.02 -13.5" rotation="-90 0 0" width="100" height="5" 
               material="color: #CBD5E1; roughness: 0.8; depthTest: true; depthWrite: true"></a-plane>

      <!-- Center Yellow Divider Line -->
      <a-plane position="0 0.03 -6" rotation="-90 0 0" width="100" height="0.2" 
               material="color: #FAC815; depthTest: true; depthWrite: true"></a-plane>

      <!-- Crosswalk Stripes -->
      <a-entity position="0 0.04 -6">
        <a-plane position="-2 0 0" rotation="-90 0 0" width="0.6" height="6.5" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="-1 0 0" rotation="-90 0 0" width="0.6" height="6.5" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="0 0 0" rotation="-90 0 0" width="0.6" height="6.5" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="1 0 0" rotation="-90 0 0" width="0.6" height="6.5" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
        <a-plane position="2 0 0" rotation="-90 0 0" width="0.6" height="6.5" material="color: #FFFFFF; depthTest: true; depthWrite: true"></a-plane>
      </a-entity>
    </a-entity>

    <!-- Traffic Vehicles -->
    <a-entity id="car1" position="30 0.6 -4.5"
              animation="property: position; to: -30 0.6 -4.5; loop: true; dur: 6000; easing: linear">
      <a-box width="3.5" height="1" depth="1.8" color="#DC2626"></a-box>
      <a-box position="0 0.7 0" width="1.8" height="0.7" depth="1.6" color="#0F172A"></a-box>
      <a-sphere position="-1.7 0.1 0.5" radius="0.15" color="#FEF08A"></a-sphere>
      <a-sphere position="-1.7 0.1 -0.5" radius="0.15" color="#FEF08A"></a-sphere>

      <a-entity class="headlight" visible="false" position="-1.8 0.1 0">
        <a-entity light="type: spot; color: #FFFDF0; intensity: 4.5; angle: 45; penumbra: 0.5" rotation="0 -90 0"></a-entity>
        <a-cone position="-2.5 0 0" rotation="0 0 -90" radius-bottom="1.2" radius-top="0.1" height="5" material="color: #FEF08A; opacity: 0.25; transparent: true"></a-cone>
      </a-entity>
    </a-entity>

    <a-entity id="car2" position="-30 0.6 -7.5"
              animation="property: position; to: 30 0.6 -7.5; loop: true; dur: 8000; easing: linear">
      <a-box width="3.8" height="1.1" depth="1.8" color="#2563EB"></a-box>
      <a-box position="0 0.7 0" width="2.0" height="0.7" depth="1.6" color="#1E293B"></a-box>
      <a-sphere position="1.9 0.1 0.5" radius="0.15" color="#FEF08A"></a-sphere>
      <a-sphere position="1.9 0.1 -0.5" radius="0.15" color="#FEF08A"></a-sphere>

      <a-entity class="headlight" visible="false" position="1.9 0.1 0">
        <a-entity light="type: spot; color: #FFFDF0; intensity: 4.5; angle: 45; penumbra: 0.5" rotation="0 90 0"></a-entity>
        <a-cone position="2.5 0 0" rotation="0 0 90" radius-bottom="1.2" radius-top="0.1" height="5" material="color: #FEF08A; opacity: 0.25; transparent: true"></a-cone>
      </a-entity>
    </a-entity>

    <!-- Animated Pedestrian Avatar -->
    <a-entity realistic-walker="speed: 1.1; direction: 1" position="-10 0 1.2" rotation="0 90 0">
      <a-entity class="torso" position="0 1.15 0">
        <a-box width="0.38" height="0.55" depth="0.22" color="#1E3A8A"></a-box>
        <a-cylinder position="0 0.38 0" radius="0.05" height="0.1" color="#D2A679"></a-cylinder>
        <a-sphere position="0 0.52 0" radius="0.12" color="#D2A679">
          <a-sphere position="0 0.05 -0.02" radius="0.128" color="#3B2314"></a-sphere>
        </a-sphere>
        <a-entity class="left-arm" position="-0.22 0.1 0">
          <a-cylinder position="0 -0.22 0" radius="0.045" height="0.48" color="#1E3A8A"></a-cylinder>
        </a-entity>
        <a-entity class="right-arm" position="0.22 0.1 0">
          <a-cylinder position="0 -0.22 0" radius="0.045" height="0.48" color="#1E3A8A"></a-cylinder>
        </a-entity>
      </a-entity>
      <a-entity class="left-thigh" position="-0.1 0.88 0">
        <a-cylinder position="0 -0.22 0" radius="0.065" height="0.45" color="#374151"></a-cylinder>
        <a-entity class="left-shin" position="0 -0.45 0">
          <a-cylinder position="0 -0.2 0" radius="0.055" height="0.4" color="#1F2937"></a-cylinder>
        </a-entity>
      </a-entity>
      <a-entity class="right-thigh" position="0.1 0.88 0">
        <a-cylinder position="0 -0.22 0" radius="0.065" height="0.45" color="#374151"></a-cylinder>
        <a-entity class="right-shin" position="0 -0.45 0">
          <a-cylinder position="0 -0.2 0" radius="0.055" height="0.4" color="#1F2937"></a-cylinder>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Player Camera Rig with WebXR Locomotion & Desktop WASD Controls -->
    <a-entity id="rig" position="0 1.6 2.0" vr-locomotion crosswalk-tracker>
      <a-camera id="head" look-controls wasd-controls="fly: false; acceleration: 25" cursor="rayOrigin: mouse">
        <!-- Canvas Overlay Plane -->
        <a-plane id="overlay" vision-overlay position="0 0 -0.5" width="2" height="2" 
                 material="shader: flat; depthTest: false; depthWrite: false; transparent: true"></a-plane>
        
        <!-- Lowered 3D VR HUD Panel (0 -0.85 -1.8 tilted -15 deg) -->
        <a-entity id="hud-panel" position="0 -0.85 -1.8" rotation="-15 0 0">
          <!-- Main Backing Plane -->
          <a-plane color="#0F172A" opacity="0.92" width="1.8" height="0.6" position="0 0 -0.01"></a-plane>
          <a-plane color="#2563EB" opacity="0.95" width="1.8" height="0.04" position="0 0.28 0"></a-plane>
          
          <!-- Compact Condition Title Text -->
          <a-text id="hud-text" value="Condition: 1/13 Normal Vision" 
                  align="center" width="1.2" color="#38BDF8" position="0 0.20 0.01"></a-text>

          <!-- Compact Game Mode Text -->
          <a-text id="game-mode-text" value="Mode: Free Explore (Idle)" 
                  align="center" width="0.95" color="#E2E8F0" position="0 0.12 0.01"></a-text>

          <!-- Compact Task Status Text -->
          <a-text id="game-status-text" value="Free Exploration - Use joystick to navigate." 
                  align="center" width="0.8" color="#94A3B8" position="0 0.05 0.01"></a-text>

          <!-- 3D Interactive Buttons Row -->
          <a-entity position="0 -0.08 0.02">
            <!-- Mode Toggle Button -->
            <a-plane class="raycastable" onclick="toggleGameMode()" position="-0.48 0 0" width="0.42" height="0.12" color="#3B82F6">
              <a-text id="mode-btn-text" value="Start Game" align="center" width="0.75" color="#FFFFFF" position="0 0 0.01"></a-text>
            </a-plane>
            
            <!-- Time of Day Buttons -->
            <a-plane class="raycastable" onclick="setEnvironmentPreset('morning')" position="-0.12 0 0" width="0.22" height="0.12" color="#0EA5E9">
              <a-text value="Day" align="center" width="0.8" color="#FFFFFF" position="0 0 0.01"></a-text>
            </a-plane>

            <a-plane class="raycastable" onclick="setEnvironmentPreset('dusk')" position="0.14 0 0" width="0.22" height="0.12" color="#F59E0B">
              <a-text value="Dusk" align="center" width="0.8" color="#FFFFFF" position="0 0 0.01"></a-text>
            </a-plane>

            <a-plane class="raycastable" onclick="setEnvironmentPreset('night')" position="0.40 0 0" width="0.22" height="0.12" color="#1E293B">
              <a-text value="Night" align="center" width="0.8" color="#FFFFFF" position="0 0 0.01"></a-text>
            </a-plane>
          </a-entity>

          <!-- Hint Footer -->
          <a-text value="Left Stick/WASD: Walk | Right Stick: Snap Turn | Trigger: Filters" 
                  align="center" width="0.75" color="#64748B" position="0 -0.22 0.01"></a-text>
        </a-entity>
      </a-camera>

      <!-- VR Controllers with Laser Pointer & Trigger Bindings -->
      <a-entity id="left-hand" mode-switcher oculus-touch-controls="hand: left" laser-controls="hand: left" raycaster="objects: .raycastable; far: 5"></a-entity>
      <a-entity id="right-hand" mode-switcher oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .raycastable; far: 5"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
